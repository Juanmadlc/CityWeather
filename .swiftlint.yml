disabled_rules:
  - empty_enum_arguments
  - switch_case_alignment
  - trailing_whitespace
  - for_where
  - unused_setter_value
  - line_length  
  - multiple_closures_with_trailing_closure 
  - vertical_whitespace 
  - opening_brace 
  - non_optional_string_data_conversion
  - todo
  - return_arrow_whitespace
 # - colon
  - unused_closure_parameter
  - trailing_newline
  - large_tuple
  - cyclomatic_complexity
 # - comma
  - comment_spacing
 # - type_body_length

opt_in_rules:
  - fatal_error_message
  - toggle_bool

excluded:
  - Carthage
  - Pods
  - fastlane
  - CityWeatherTests

# Modified rules
file_length:
  warning: 600
  error: 1200
  ignore_comment_only_lines: true

function_body_length:
  warning: 300
  error: 500

function_parameter_count:
  warning: 6
  error: 8

identifier_name:
  allowed_symbols: "_"
  min_length:
    warning: 2
  excluded:
    - id
    - URL

type_body_length:
  warning: 600
  error: 800
